name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, build, format
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Assert EAS pnpm version matches packageManager
        run: node tools/assert-eas-pnpm-version.mjs

      - name: Assert pnpm linker setting
        run: |
          linker="$(pnpm config get node-linker)"
          echo "node-linker=$linker"
          test "$linker" = "hoisted" || {
            echo "::error::pnpm-workspace.yaml is not applying nodeLinker (node-linker=$linker, expected hoisted). See ADR-008 and ADR-038."
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert flat node_modules layout
        run: |
          test -d node_modules/react-native || {
            echo "::error::node_modules/react-native is missing at the root: the layout is not hoisted. See ADR-008."
            exit 1
          }
          isolated="$(find node_modules/.pnpm -mindepth 1 -maxdepth 1 ! -name lock.yaml 2>/dev/null | wc -l)"
          test "$isolated" = "0" || {
            echo "::error::node_modules/.pnpm holds $isolated entries: the layout is isolated, not hoisted. See ADR-008."
            exit 1
          }

      - name: Audit production dependencies
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Format check
        run: pnpm run format:check

      # Build compiles shared, ui-mobile and app-runtime with tsc; the apps have no build script, so the
      # native bundle is made by EAS outside this CI. Metro bundle smoke is the manual procedure in
      # README.md ("Bundle smoke"); a CI job for it is recommended by ADR-008 section 8 and not blocking.
