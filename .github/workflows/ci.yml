name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, build, format
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Assert pnpm linker
        run: |
          linker="$(pnpm config get node-linker)"
          echo "node-linker=$linker"
          test "$linker" = "hoisted" || {
            echo "::error::.npmrc no se está aplicando (node-linker=$linker, esperado hoisted). Ver ADR-008."
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Format check
        run: pnpm run format:check

      # No hay un paso "test": los scripts "test" de los 4 paquetes (apps/passenger,
      # apps/driver, packages/ui-mobile, packages/shared) son stubs que solo
      # imprimen un mensaje y salen con exit 0 — no ejecutan ningún test real.
      # Añadir aquí un paso "pnpm run test" simularía una garantía de calidad
      # inexistente. Este CI verifica lo que hoy sí se puede comprobar sin
      # credenciales: typecheck, lint, build y format:check.
      #
      # "build" compila con tsc packages/shared y packages/ui-mobile (los únicos
      # con script "build"); apps/passenger y apps/driver no declaran ese script
      # y turbo los omite — el bundle nativo/Expo se genera vía EAS Build fuera
      # de este CI, ya que requiere credenciales que no viven en este repo.
      #
      # Tampoco hay verificación de que el bundle de Metro construya: este CI
      # pasa en verde con una app que no arranca (fue exactamente lo que ocurrió
      # con el defecto de ADR-008). El paso "Assert pnpm linker" de arriba cubre
      # una causa concreta de ese fallo, pero no sustituye un smoke test de
      # bundle real. Ver ADR-008 §8: job "bundle-smoke" recomendado, no
      # implementado aquí (dueños: pruebas + frontend).
